# Our app plus the synthetic silo service.
# Zetaris and Nightshift are NOT here: they run on the host, per the
# Participant Setup Guide. Containers reach them via host.docker.internal.

services:
  app:
    build: .
    # Optional, so a fresh clone runs:  SAMPLE_MODE=true docker compose up --build
    env_file:
      - path: .env
        required: false
    environment:
      # From the shell, else from .env (compose reads it for interpolation), else live.
      SAMPLE_MODE: ${SAMPLE_MODE:-false}
      # Override the host-facing URLs for in-container networking.
      ZETARIS_REST_URL: http://host.docker.internal:8888/api/v1.0
      METERLESS_BASE_URL: http://host.docker.internal:8088/v1
      # Only the INTERNAL url is a compose hostname. DATASVC_PUBLIC_URL is
      # deliberately NOT overridden: it is baked into the registration SQL and
      # must stay reachable from the Zetaris containers, which are in a
      # different compose project and cannot resolve "datasvc".
      DATASVC_INTERNAL_URL: http://datasvc:8100
      PORT: "8000"
    ports: ["8000:8000"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ./logs:/app/logs
      # A named volume, not ./.state: that directory is untracked, so on a fresh clone
      # Docker would create it root-owned and the non-root app could not persist
      # H-MEM or World Model state. A named volume starts owned by the app user.
      - hakken-state:/app/.state
    depends_on: [datasvc]

  datasvc:
    build: .
    command: ["python", "-m", "uvicorn", "datasvc.main:app", "--host", "0.0.0.0", "--port", "8100"]
    # Published on the host too, so the Zetaris containers can reach it at
    # host.docker.internal:8100 when registering REST tables.
    ports: ["8100:8100"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    # What it serves is gitignored and kept out of the image (.dockerignore): the silos
    # come from `make synth`, the reference tables from `make lexicon`. Mounted read-only.
    volumes:
      - ./data:/app/data:ro

volumes:
  hakken-state:
