[pytest]
testpaths = tests
pythonpath = .
addopts = -q --strict-markers
asyncio_default_fixture_loop_scope = function
filterwarnings =
    error::DeprecationWarning
    # starlette's TestClient triggers a deprecation inside anyio. Ours to ignore,
    # not ours to fix -- scoped to this one message so our own deprecations still
    # fail the build.
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning
markers =
    slow: regenerates data or shells out; still runs in CI, just slower
